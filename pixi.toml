[workspace]
name = "module_pv_wind"
authors = ["See AUTHORS file"]
description = "This data module produces capacity factors for PV and wind at arbitrary spatial resolution."
license = "Apache-2.0"
readme = "README.md"
channels = ["conda-forge", "bioconda"]
platforms = ["win-64", "linux-64", "osx-arm64"]
homepage = "https://www.modelblocks.org/"

[dependencies]
clio-tools = ">=2026.03.30"
conda = ">=25.0.0"
ipdb = ">=0.13.13"
ipykernel = ">=6.29.5"
jsonschema = ">=4.0.0"
mypy = ">=1.15.0"
pytest = ">=8.3.5"
python = ">=3.12"
ruff = ">=0.9.9"
snakefmt = ">=0.10.2"
snakemake-minimal = ">=9.19.0"
pytz = ">=2026.1.post1"

[feature.atlite.dependencies]
atlite = "==0.6.1"
rioxarray = "==0.22.0"
rasterio = "==1.5.0"
geopandas = "==1.1.3"
pandera-geopandas = "==0.31.1"
ipykernel = ">=7.3.0,<8"
gregor = ">=0.0.2,<0.0.3"
sparse = ">=0.18.0,<0.19"

[environments]
atlite = { features = ["atlite"], no-default-feature=true }
test = { features = ["atlite", "test-module"], no-default-feature = true }

[feature.test-module.tasks]
test-unit = { cmd = "pytest tests/unit" }

[tasks]
test-integration = { cmd = "pytest tests/integration_test.py" }
