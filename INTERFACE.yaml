# Module Input-Output structure for automated docs generation
convention_version: v1.0.0

pathvars:
  snakemake_defaults:
    logs:
      default: "<logs>"
      description: location of rule log files.
    resources:
      default: "<resources>"
      description: "location of module resource files."
    results:
      default: "<results>"
      description: "location of module results."
  user_resources:
    cutout:
      default: "<resources>/user/cutouts_{cutout}.nc"
      description: "Cutout of meteorological data provided by user."
    tech_specs:
      default: "<resources>/user/tech_specs_{tech}.yaml"
      description: "Technology specification of PV/wind."
    layout_raster:
      default: "<resources>/user/layouts_{layout}.tif"
      description: "Raster layout file describing the spatial distribution of capacity."
    layout_point:
      default: "<resources>/user/layouts_{layout}.parquet"
      description: "Point layout file describing the spatial distribution of capacity."
    shapes:
      default: "<resources>/user/shapes_{shape}.parquet"
      description: "Geometries of shapes (e.g., administrative regions)."
  results:
    capacity_factors:
      default: "<results>/{cutout}/{shape}/{layout}/capacityfactors_{tech}.nc"
      description: "Capacity factors for the specified technology."
wildcards:
  cutout: "Cutout name"
  tech: "Technology name"
  layout: "Layout name"
  shape: "Shape name"
